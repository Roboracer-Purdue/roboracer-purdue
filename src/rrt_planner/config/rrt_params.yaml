rrt_planner:
  ros__parameters:
    amcl_topic: /amcl_pose
    scan_topic: /scan
    path_topic: /planned_path
    goal_topic: /rrt_goal

    map_frame: map
    plan_rate_hz: 3.0

    waypoints_csv: /home/arc/f1tenth_ws/waypoints/raw/sl28_points.csv
    goal_distance: 2.0
    goal_tolerance: 0.35
    loop_path: false

    sample_x_min: -0.5
    sample_x_max: 3.0
    sample_y_min: -1.5
    sample_y_max: 1.5

    max_iterations: 500
    step_size: 0.30
    goal_sample_rate: 0.25

    robot_radius: 0.25
    collision_check_resolution: 0.05
    scan_range_min_clip: 0.05
    scan_range_max_clip: 8.0

    enable_path_shortening: true
    path_shortening_passes: 80

    debug: true
    random_seed: 42